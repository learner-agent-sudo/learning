name: Refresh CUAD clauses

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/extract_cuad.py'
      - '.github/workflows/extract-cuad.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install datasets
        run: pip install --quiet datasets

      - name: Run extraction
        run: python scripts/extract_cuad.py

      - name: Commit clauses.json if changed
        run: |
          if git diff --quiet public/clauses.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/clauses.json
          git commit -m "Refresh CUAD clauses (automated)"
          # Another push may land while this job runs; rebase onto it.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
