name: Refresh HK legislation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'   # weekly; HK e-Legislation bundles update weekly
  push:
    paths:
      - 'scripts/extract_hkel.py'
      - 'scripts/requirements-hkel.txt'
      - '.github/workflows/refresh-hkel.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install the hardened XML parser
        run: pip install --require-hashes -r scripts/requirements-hkel.txt

      - name: Download bundles and extract chapters
        run: python scripts/extract_hkel.py

      - name: Commit data/hkel if changed
        run: |
          git add data/hkel
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh HK legislation (automated)"
          # Another push may land while this job runs; rebase onto it.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
